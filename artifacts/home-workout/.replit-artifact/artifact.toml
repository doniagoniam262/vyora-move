kind = "web"
previewPath = "/"
title = "VYORA | ڤايورا"
description = "A professional Arabic RTL home-workout app with an exercise library, guided training plans, a real session timer, local progress tracking, and the dark lime VYORA visual identity."
version = "1.0.0"
id = "artifacts/home-workout"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21503

[services.development]
run = "pnpm --filter @workspace/home-workout run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/home-workout", "run", "build" ]
serve = "static"
publicDir = "artifacts/home-workout/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21503"
BASE_PATH = "/"
