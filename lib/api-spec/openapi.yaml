openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Storage
    description: Public App Storage assets.
  - name: Exercises
    description: Exercise catalog.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storage/public-objects/{filePath}:
    get:
      operationId: getPublicObject
      tags: [Storage]
      summary: Serve a public App Storage asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found
  /exercises:
    get:
      operationId: getExercises
      tags: [Exercises]
      summary: Get the exercise catalog
      responses:
        "200":
          description: The complete ordered exercise catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExerciseCatalogItem"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ExerciseCatalogItem:
      type: object
      required:
        - id
        - name
        - latin
        - nameEn
        - category
        - level
        - image
        - duration
        - reps
        - sets
        - instructions
        - safety
        - easier
        - sortOrder
      properties:
        id:
          type: string
        name:
          type: string
        latin:
          type: string
        nameEn:
          type: string
        category:
          type: string
          enum: [full, upper, lower, abs, warmup, stretch]
        level:
          type: string
          enum: [beginner, intermediate]
        image:
          type: string
        duration:
          type: integer
        reps:
          type: ["integer", "null"]
        sets:
          type: integer
        instructions:
          type: array
          items:
            type: string
        safety:
          type: string
        easier:
          type: string
        sortOrder:
          type: integer

